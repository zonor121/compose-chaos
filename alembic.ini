[alembic]
script_location = src/compose_chaos/store/migrations
# URL берётся из настройки CHAOS_DATABASE_URL (см. src/compose_chaos/config.py);
# значение ниже — резервное для офлайн-генерации.
sqlalchemy.url = postgresql+asyncpg://chaos:chaos@localhost:5433/chaos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
